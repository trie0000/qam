<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>QAM — 注入固定ヘッダー下での表示検証</title>
<style>
  /* ホスト側（SharePoint / 企業ポータル / ブラウザ拡張）が注入する固定ヘッダーの再現。
     実物と同じく position:fixed + 巨大 z-index を持たせる。 */
  body { margin: 0; }
  #fake-host-header {
    position: fixed; top: 0; left: 0; right: 0; height: 64px; z-index: 1000000;
    background: #0b5cab; color: #fff; display: flex; align-items: center; gap: 16px;
    padding: 0 16px; font: 14px/1.4 sans-serif;
  }
</style>
</head>
<body>
  <div id="fake-host-header">HOST HEADER (position:fixed, z-index:1000000)</div>
  <script src="../dist/qam.bundle.js"></script>
</body>
</html>
